version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: pulseai_user
      POSTGRES_PASSWORD: pulseai_password
      POSTGRES_DB: pulseai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseai_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
